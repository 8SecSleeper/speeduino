; Reads the boot-progress markers the firmware leaves in the Teensy's internal
; EEPROM. Read-only with respect to the trace. See src/main.cpp.
;
; Note: flashing this REPLACES the Speeduino firmware. Reflash with
;   pio run -e teensy41 -t upload
; afterwards.

[env:boot_trace]
platform = https://github.com/platformio/platform-teensy.git
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -DTEENSY_INIT_USB_DELAY_AFTER=40
lib_deps = EEPROM
