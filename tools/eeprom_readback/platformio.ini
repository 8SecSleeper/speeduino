; Read-only EEPROM magic-number checker for the DropBear v2 onboard flash.
;
; Separate project from the main firmware, and read-only - it never erases or
; programs. See src/main.cpp for usage.

[env:eeprom_readback]
platform = https://github.com/platformio/platform-teensy.git
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -DTEENSY_INIT_USB_DELAY_AFTER=40
