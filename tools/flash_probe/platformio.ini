; Standalone hardware diagnostic for the DropBear v2 onboard SPI flash.
;
; This is deliberately a SEPARATE PlatformIO project from the main firmware so it
; cannot affect the Speeduino build. It does not include any Speeduino code.
;
; Usage:
;   pio run -d tools/flash_probe -t upload
;   pio device monitor -d tools/flash_probe -b 115200
;
; Then use the single-key menu over the serial monitor.

[env:flash_probe]
platform = https://github.com/platformio/platform-teensy.git
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -DTEENSY_INIT_USB_DELAY_AFTER=40
